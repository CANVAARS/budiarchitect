<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galeri Seni Mewah 3D</title>
  
  <!-- Import Map Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg-dark: #05050a;
      --accent: #e8c97c;
      --text: #f2f0f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg-dark); color: var(--text); touch-action: none; }

    #canvas-container { width: 100%; height: 100%; display: block; }

    /* Crosshair Titik Tengah */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 6px; height: 6px; margin: -3px 0 0 -3px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%; pointer-events: none; z-index: 2;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    /* HUD Petunjuk Navigasi */
    #instructions {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 9, 18, 0.85); border: 1px solid rgba(232, 201, 124, 0.3);
      padding: 10px 20px; border-radius: 50px; backdrop-filter: blur(10px);
      font-size: 0.8rem; letter-spacing: 0.05em; pointer-events: none; z-index: 2;
      text-align: center; color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    /* Layar Awal (Click to Enter) */
    #start-prompt {
      position: absolute; inset: 0; z-index: 10;
      background: radial-gradient(circle, rgba(20,18,32,0.95) 0%, rgba(5,5,10,0.98) 100%);
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; text-align: center; padding: 20px;
    }
    #start-prompt h1 { font-size: 2.5rem; color: var(--accent); margin-bottom: 12px; font-weight: 300; letter-spacing: 2px; }
    #start-prompt p { font-size: 1rem; color: #a09ab5; margin-bottom: 25px; }
    .btn-enter {
      background: linear-gradient(135deg, #e8c97c, #cfa863); color: #0a0912;
      padding: 14px 32px; border-radius: 30px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; box-shadow: 0 8px 20px rgba(232,201,124,0.3);
    }

    /* Modal Detail Karya / Pamflet */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: #12101c; border: 1px solid rgba(232, 201, 124, 0.4);
      max-width: 850px; width: 100%; border-radius: 18px; overflow: hidden;
      display: grid; grid-template-columns: 1fr 1fr; position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    @media(max-width: 750px) { .modal-card { grid-template-columns: 1fr; } }
    .modal-img-wrapper { background: #050508; display: flex; align-items: center; justify-content: center; padding: 10px; }
    .modal-img-wrapper img { max-width: 100%; max-height: 420px; object-fit: contain; border-radius: 4px; }
    .modal-info { padding: 35px; display: flex; flex-direction: column; justify-content: center; }
    .modal-info h2 { font-size: 1.8rem; color: var(--accent); margin-bottom: 12px; font-weight: 400; }
    .modal-info p { color: #a49eb8; font-size: 0.95rem; line-height: 1.7; }
    .close-btn {
      position: absolute; top: 15px; right: 20px; background: none; border: none;
      color: #fff; font-size: 1.8rem; cursor: pointer; transition: color 0.2s;
    }
    .close-btn:hover { color: var(--accent); }

    /* ==========================================
       KONTROL NAVIGASI KURSOR UNTUK HP (DPAD)
       ========================================== */
    #mobile-controls {
      position: absolute;
      bottom: 25px;
      left: 20px;
      width: 140px;
      height: 140px;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 5px;
      user-select: none;
      -webkit-user-select: none;
    }

    .dpad-btn {
      background: rgba(18, 16, 28, 0.7);
      border: 1px solid rgba(232, 201, 124, 0.4);
      color: var(--accent);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      backdrop-filter: blur(8px);
      touch-action: manipulation;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .dpad-btn:active {
      background: var(--accent);
      color: #000;
      transform: scale(0.95);
    }

    /* Penataan Tombol D-Pad Cross */
    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }

    /* Sembunyikan instruksi PC & atur D-Pad saat di HP */
    @media (max-width: 768px) {
      #instructions { font-size: 0.75rem; bottom: 10px; }
    }
  </style>
</head>
<body>

  <div id="start-prompt">
    <h1>PAMERAN SENI MODERN</h1>
    <p>Jelajahi galeri interaktif dengan kualitas 3D realistis</p>
    <div class="btn-enter">Klik Untuk Masuk Ruangan</div>
  </div>

  <div id="crosshair"></div>
  <div id="instructions">
    <b>WASD / Tombol Layar</b> untuk jalan &middot; <b>Geser Layar</b> untuk melihat sekitar
  </div>

  <!-- Tombol Kursor HP (Virtual D-Pad) -->
  <div id="mobile-controls">
    <div class="dpad-btn" id="btn-up">▲</div>
    <div class="dpad-btn" id="btn-left">◄</div>
    <div class="dpad-btn" id="btn-right">►</div>
    <div class="dpad-btn" id="btn-down">▼</div>
  </div>

  <div id="canvas-container"></div>

  <!-- Pop-up Detail Lukisan / Pamflet -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <button class="close-btn" id="close-modal">&times;</button>
      <div class="modal-img-wrapper">
        <img id="modal-img" src="" alt="Detail Interaktif">
      </div>
      <div class="modal-info">
        <h2 id="modal-title">Judul Informasi</h2>
        <p id="modal-desc">Deskripsi karya seni atau isi pamflet akan tampil di sini.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // ==========================================
    // 1. DATA 20 GAMBAR LUKISAN (Berdasarkan Folder)
    // ==========================================
    const daftarFolder = [
      { nama: "Azhar", jumlahGambar: 5, ekstensi: "png" },
      { nama: "Karya", jumlahGambar: 10, ekstensi: "jpg" },
      { nama: "Warkim", jumlahGambar: 5, ekstensi: "png" }
    ];

    let idCounter = 1;

    const DAFTAR_GAMBAR = daftarFolder.flatMap((folder) =>
      Array.from({ length: folder.jumlahGambar }, (_, i) => ({
        id: idCounter++,
        seniman: folder.nama,
        judul: `Masterpiece #${i + 1} (${folder.nama})`,
        deskripsi: `Karya seni bernilai tinggi nomor ${i + 1} dari ${folder.nama}. Pencahayaan sorot khusus digunakan untuk menonjolkan tekstur dan gradasi warna kanvas.`,
        url: `Galeri/${folder.nama}/${i + 1}.${folder.ekstensi}`
      }))
    );

    // Data 20 Banner Pameran di Tengah Ruangan
    const BANNER_DATA = Array.from({ length: 20 }, (_, i) => ({
      id: i + 1,
      judul: `Banner Pameran #${i + 1}`,
      deskripsi: `Sorotan informasi koleksi nomor ${i + 1}. Banner ini menampilkan tema, latar belakang, dan cerita kurator di balik karya-karya terpilih.`,
      url: `https://picsum.photos/seed/banner${i + 1}/600/900`
    }));

    // ==========================================
    // 2. INITIALIZE SCENE, CAMERA, RENDERER
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf3f2ee);
    scene.fog = new THREE.FogExp2(0xf3f2ee, 0.012);

    const ROOM_WIDTH = 32;   
    const ROOM_DEPTH = 42;   
    const TINGGI_RUANGAN = 6.5;
    const ROOM_CENTER_Z = -ROOM_DEPTH / 2 + 14; 
    const ENTRANCE_Z = ROOM_CENTER_Z + ROOM_DEPTH / 2 - 3; 

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 1.7, ENTRANCE_Z - 2); 

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // ==========================================
    // 3. LANTAI KAYU, DINDING PUTIH, PILAR & TRACK LIGHTING
    // ==========================================
    function createWoodFloorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const plankCount = 10;
      const plankWidth = 1024 / plankCount;
      for (let i = 0; i < plankCount; i++) {
        const r = 150 + Math.random() * 35, g = 108 + Math.random() * 25, b = 66 + Math.random() * 20;
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(i * plankWidth, 0, plankWidth - 1.5, 1024);
      }
      ctx.strokeStyle = 'rgba(60,38,18,0.12)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 220; i++) {
        const x = Math.random() * 1024;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.bezierCurveTo(x + 8, 300, x - 8, 700, x + (Math.random() - 0.5) * 16, 1024);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(45,28,14,0.35)';
      ctx.lineWidth = 2;
      for (let i = 0; i <= plankCount; i++) {
        ctx.beginPath(); ctx.moveTo(i * plankWidth, 0); ctx.lineTo(i * plankWidth, 1024); ctx.stroke();
      }
      for (let j = 0; j < 5; j++) {
        const y = (j / 5) * 1024 + Math.random() * 40;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(ROOM_WIDTH / 6, ROOM_DEPTH / 6);
      return tex;
    }

    const floorGeo = new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH);
    const floorMat = new THREE.MeshStandardMaterial({ map: createWoodFloorTexture(), roughness: 0.45, metalness: 0.08 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, ROOM_CENTER_Z);
    scene.add(floor);

    const ceilGeo = new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH);
    const ceilMat = new THREE.MeshStandardMaterial({ color: 0xf7f6f2, roughness: 0.92 });
    const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, TINGGI_RUANGAN, ROOM_CENTER_Z);
    scene.add(ceiling);

    const trackRailMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4, metalness: 0.6 });
    const trackFixtureMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.3, metalness: 0.7 });

    function createTrackRail(x) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, ROOM_DEPTH), trackRailMat);
      rail.position.set(x, TINGGI_RUANGAN - 0.05, ROOM_CENTER_Z);
      scene.add(rail);

      const fixtureCount = Math.round(ROOM_DEPTH / 3);
      for (let i = 0; i < fixtureCount; i++) {
        const z = ROOM_CENTER_Z + ROOM_DEPTH / 2 - 1.5 - i * 3;
        const fixture = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 0.15, 10), trackFixtureMat);
        fixture.position.set(x, TINGGI_RUANGAN - 0.14, z);
        scene.add(fixture);

        const downLight = new THREE.PointLight(0xfff4e0, 3.2, 9, 2);
        downLight.position.set(x, TINGGI_RUANGAN - 0.2, z);
        scene.add(downLight);
      }
    }
    createTrackRail(-ROOM_WIDTH / 4);
    createTrackRail(ROOM_WIDTH / 4);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f4f0, roughness: 0.95 });

    const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_DEPTH, TINGGI_RUANGAN), wallMat);
    wallLeft.position.set(-ROOM_WIDTH / 2, TINGGI_RUANGAN / 2, ROOM_CENTER_Z);
    wallLeft.rotation.y = Math.PI / 2;
    scene.add(wallLeft);

    const wallRight = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_DEPTH, TINGGI_RUANGAN), wallMat);
    wallRight.position.set(ROOM_WIDTH / 2, TINGGI_RUANGAN / 2, ROOM_CENTER_Z);
    wallRight.rotation.y = -Math.PI / 2;
    scene.add(wallRight);

    const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, TINGGI_RUANGAN), wallMat);
    wallBack.position.set(0, TINGGI_RUANGAN / 2, ROOM_CENTER_Z - ROOM_DEPTH / 2);
    scene.add(wallBack);

    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xf2f1ec, roughness: 0.92 });
    function createPillar(x, z) {
      const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.1, TINGGI_RUANGAN, 1.1), pillarMat);
      pillar.position.set(x, TINGGI_RUANGAN / 2, z);
      scene.add(pillar);
    }
    const pillarX = ROOM_WIDTH / 2 - 3;
    [-13, 0, 13].forEach((dz) => {
      createPillar(-pillarX, ROOM_CENTER_Z + dz);
      createPillar(pillarX, ROOM_CENTER_Z + dz);
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    scene.add(new THREE.HemisphereLight(0xffffff, 0xdad6c8, 0.5));

    // ==========================================
    // 4. PEMASANGAN LUKISAN + SPOTLIGHT
    // ==========================================
    const textureLoader = new THREE.TextureLoader();
    const interactiveObjects = [];

    function mountPainting(item, xPos, zPos, rotY, wallSide) {
      const group = new THREE.Group();
      group.position.set(xPos, 2.3, zPos);
      group.rotation.y = rotY;

      const frameGeo = new THREE.BoxGeometry(2.4, 2.4, 0.08);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 0.4, metalness: 0.3 });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      group.add(frame);

      const texture = textureLoader.load(item.url);
      const artGeo = new THREE.PlaneGeometry(2.2, 2.2);
      const artMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.4 });
      const artMesh = new THREE.Mesh(artGeo, artMat);
      artMesh.position.z = 0.05;
      artMesh.userData = { ...item, type: 'artwork' };

      group.add(artMesh);
      interactiveObjects.push(artMesh);
      scene.add(group);

      const lampX = wallSide === 0 ? xPos : xPos - wallSide * 1.5;
      const lampZ = wallSide === 0 ? zPos + 1.5 : zPos;

      const spotLight = new THREE.SpotLight(0xfff0d0, 25, 8, 0.5, 0.6);
      spotLight.position.set(lampX, TINGGI_RUANGAN - 0.3, lampZ);
      spotLight.target = artMesh;
      scene.add(spotLight);

      const lampHousing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.18, 0.3, 12),
        new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.2 })
      );
      lampHousing.position.set(lampX, TINGGI_RUANGAN - 0.15, lampZ);
      scene.add(lampHousing);
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    const wallZTop = ROOM_CENTER_Z + ROOM_DEPTH / 2 - 4;
    const wallZBottom = ROOM_CENTER_Z - ROOM_DEPTH / 2 + 4;
    const backXLeft = -(ROOM_WIDTH / 2 - 4);
    const backXRight = ROOM_WIDTH / 2 - 4;
    const backWallZ = ROOM_CENTER_Z - ROOM_DEPTH / 2 + 0.08;

    const leftCount = 7, rightCount = 7, backCount = 6;
    let gi = 0;

    for (let i = 0; i < leftCount; i++) {
      const t = leftCount === 1 ? 0.5 : i / (leftCount - 1);
      const z = lerp(wallZTop, wallZBottom, t);
      mountPainting(DAFTAR_GAMBAR[gi++], -ROOM_WIDTH / 2 + 0.08, z, Math.PI / 2, -1);
    }
    for (let i = 0; i < rightCount; i++) {
      const t = rightCount === 1 ? 0.5 : i / (rightCount - 1);
      const z = lerp(wallZTop, wallZBottom, t);
      mountPainting(DAFTAR_GAMBAR[gi++], ROOM_WIDTH / 2 - 0.08, z, -Math.PI / 2, 1);
    }
    for (let i = 0; i < backCount; i++) {
      const t = backCount === 1 ? 0.5 : i / (backCount - 1);
      const x = lerp(backXLeft, backXRight, t);
      mountPainting(DAFTAR_GAMBAR[gi++], x, backWallZ, 0, 0);
    }

    // ==========================================
    // 5. BANNER PAMERAN
    // ==========================================
    function createBannerStand(x, z, data) {
      const standGroup = new THREE.Group();
      standGroup.position.set(x, 0, z);

      const baseMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.0, 0.12, 0.35),
        new THREE.MeshStandardMaterial({ color: 0x1a1829, roughness: 0.4, metalness: 0.4 })
      );
      baseMesh.position.y = 0.06;
      standGroup.add(baseMesh);

      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.03, 0.03, 2.3, 8),
        new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.6, roughness: 0.35 })
      );
      pole.position.set(0, 1.27, -0.15);
      standGroup.add(pole);

      const bannerTexture = textureLoader.load(data.url);
      const bannerGeo = new THREE.PlaneGeometry(1.1, 2.2);
      const bannerMat = new THREE.MeshStandardMaterial({ map: bannerTexture, roughness: 0.35, side: THREE.DoubleSide });
      const bannerMesh = new THREE.Mesh(bannerGeo, bannerMat);
      bannerMesh.position.set(0, 1.3, 0);
      bannerMesh.userData = { ...data, type: 'banner' };
      standGroup.add(bannerMesh);

      interactiveObjects.push(bannerMesh);
      scene.add(standGroup);
    }

    const BANNER_ROWS = 5;
    const BANNER_COLS = 4;
    const ROW_GAP = 5.2;
    const COL_GAP = 5.0;
    const ZIGZAG_OFFSET = COL_GAP / 2;

    for (let r = 0; r < BANNER_ROWS; r++) {
      const z = ROOM_CENTER_Z + ((BANNER_ROWS - 1) / 2 - r) * ROW_GAP;
      const shift = (r % 2 === 1) ? ZIGZAG_OFFSET : 0; 
      for (let c = 0; c < BANNER_COLS; c++) {
        const x = (c - (BANNER_COLS - 1) / 2) * COL_GAP + shift;
        const idx = r * BANNER_COLS + c;
        createBannerStand(x, z, BANNER_DATA[idx]);
      }

      const rowLight = new THREE.SpotLight(0xffffff, 18, 14, 0.9, 0.6);
      rowLight.position.set(0, TINGGI_RUANGAN - 0.3, z);
      rowLight.target.position.set(0, 1.3, z);
      scene.add(rowLight);
      scene.add(rowLight.target);
    }

    // ==========================================
    // 6. CONTROLS & NAVIGASI (KEYBOARD & TOUCH HP)
    // ==========================================
    const controls = new PointerLockControls(camera, document.body);
    const startPrompt = document.getElementById('start-prompt');

    startPrompt.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => startPrompt.style.display = 'none');
    controls.addEventListener('unlock', () => {
      if (document.getElementById('modal').style.display !== 'flex') {
        startPrompt.style.display = 'flex';
      }
    });

    const move = { forward: false, backward: false, left: false, right: false };

    // A. Keyboard Event (PC)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') move.forward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') move.backward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') move.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') move.right = true;
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') move.forward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') move.backward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') move.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') move.right = false;
    });

    // B. Touch Event Tombol Virtual D-Pad (HP)
    function setupTouchButton(id, direction) {
      const btn = document.getElementById(id);
      const startMove = (e) => {
        e.preventDefault();
        move[direction] = true;
      };
      const endMove = (e) => {
        e.preventDefault();
        move[direction] = false;
      };

      btn.addEventListener('touchstart', startMove, { passive: false });
      btn.addEventListener('touchend', endMove, { passive: false });
      btn.addEventListener('mousedown', startMove);
      btn.addEventListener('mouseup', endMove);
    }

    setupTouchButton('btn-up', 'forward');
    setupTouchButton('btn-down', 'backward');
    setupTouchButton('btn-left', 'left');
    setupTouchButton('btn-right', 'right');

    // C. Touch Drag Rotasi Kamera untuk HP (Melihat Sekitar)
    let touchStartX = 0, touchStartY = 0;
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && e.target.tagName !== 'BUTTON' && !e.target.classList.contains('dpad-btn')) {
        touchStartX = e.touches[0].pageX;
        touchStartY = e.touches[0].pageY;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && e.target.tagName !== 'BUTTON' && !e.target.classList.contains('dpad-btn')) {
        const touchX = e.touches[0].pageX;
        const touchY = e.touches[0].pageY;

        const movementX = touchX - touchStartX;
        const movementY = touchY - touchStartY;

        touchStartX = touchX;
        touchStartY = touchY;

        euler.setFromQuaternion(camera.quaternion);
        euler.y -= movementX * 0.004;
        euler.x -= movementY * 0.004;
        euler.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, euler.x));

        camera.quaternion.setFromEuler(euler);
      }
    }, { passive: true });

    // Raycaster untuk Klik Objek (Lukisan / Banner)
    const raycaster = new THREE.Raycaster();
    const modal = document.getElementById('modal');

    function checkInteraction() {
      raycaster.setFromCamera({ x: 0, y: 0 }, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0 && intersects[0].distance < 7) {
        const data = intersects[0].object.userData;
        
        document.getElementById('modal-img').src = data.url;
        document.getElementById('modal-title').textContent = data.judul;
        document.getElementById('modal-desc').textContent = data.deskripsi;
        
        modal.classList.add('active');
        if (controls.isLocked) controls.unlock();
      }
    }

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('dpad-btn')) return;
      if (controls.isLocked) checkInteraction();
    });

    document.getElementById('close-modal').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    // ==========================================
    // 7. ANIMASI LOOP
    // ==========================================
    let prevTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      const speed = 5.0 * delta;

      // Pergerakan Kamera (Bisa dari PC atau Kursor HP)
      if (move.forward) camera.translateZ(-speed);
      if (move.backward) camera.translateZ(speed);
      if (move.left) camera.translateX(-speed);
      if (move.right) camera.translateX(speed);

      // Batas Wilayah Berjalan (Kamera tidak menembus dinding)
      camera.position.x = Math.max(-ROOM_WIDTH / 2 + 0.9, Math.min(ROOM_WIDTH / 2 - 0.9, camera.position.x));
      camera.position.z = Math.max(ROOM_CENTER_Z - ROOM_DEPTH / 2 + 1.5, Math.min(ENTRANCE_Z, camera.position.z));
      camera.position.y = 1.7; // Menjaga tinggi mata

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
